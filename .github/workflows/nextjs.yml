name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Quitamos el 'defaults' para que los comandos corran desde la raíz por defecto
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        # Ahora sí encontrará el package-lock.json en la raíz
        run: npm ci

      - name: Build with Next.js
        # Ejecutamos el build específicamente para el workspace del frontend
        run: npm run build --workspace=frontend

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # La carpeta 'out' se genera dentro de frontend, así que apuntamos ahí
          path: frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5